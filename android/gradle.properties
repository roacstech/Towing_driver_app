# Gradle memory and JVM configuration optimized for stability and speed
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC --enable-native-access=ALL-UNNAMED
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.vfs.watch=true

# Set to false on Windows to prevent Kotlin compiler daemon file lock error:
# "Could not close incremental caches in ... caches-jvm"
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx512m

# Build optimizations
kapt.incremental.apt=true
android.enableR8.fullMode=false
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
