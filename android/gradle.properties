# Gradle memory and JVM configuration optimized for stability and low memory footprint
org.gradle.jvmargs=-Xms256m -Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.vfs.watch=false

# Set to false on Windows to prevent Kotlin compiler daemon file lock error:
# "Could not close incremental caches in ... caches-jvm"
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx256m

# Build optimizations
kapt.incremental.apt=true
android.enableR8.fullMode=false
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
