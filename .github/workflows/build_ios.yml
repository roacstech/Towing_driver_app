name: Build Driver App for iOS

on:
  push:
    branches: [ "main", "madhavan" ]
  pull_request:
    branches: [ "main", "madhavan" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Driver iOS (.ipa / .app)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Xcode Version
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload as IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r TowingDriver-unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowingDriver-iOS-IPA
          path: build/ios/iphoneos/TowingDriver-unsigned.ipa
          retention-days: 14

      - name: Upload iOS Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: TowingDriver-Runner-App
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
