workflows:
  ios-driver-build:
    name: Build Towing Driver iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Flutter iOS (.app and .ipa)
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter packages pub get
          flutter build ios --config-only --no-codesign
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/ios
          cd build/ios/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Towing_Driver_App.ipa Payload
    artifacts:
      - build/ios/Build/Products/Release-iphoneos/Runner.app
      - build/ios/Build/Products/Release-iphoneos/Towing_Driver_App.ipa
      - build/ios/Build/Products/Release-iphoneos/*.ipa
      - build/ios/Build/Products/Release-iphoneos/*.app
    publishing:
      email:
        recipients:
          - malarkannanmadhavan@gmail.com
        notify:
          success: true
          failure: true
